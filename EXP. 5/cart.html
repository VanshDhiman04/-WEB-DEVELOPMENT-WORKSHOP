
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Online Bookstore Shopping Cart">
    <meta name="author" content="Vansh">
    <title>Shopping Cart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="cart-page">

    <h2>Shopping Cart</h2>

    <table class="cart">
        <thead>
            <tr>
                <th>Book</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
        </thead>

        <tbody id="cartItems"></tbody>

        <tfoot>
            <tr>
                <th colspan="2">Grand Total</th>
                <th id="grandTotal">$0.00</th>
            </tr>
        </tfoot>
    </table>

    <div class="cart-actions">
        <button type="button" onclick="clearCart()">Clear Cart</button>
    </div>

    <script>
        function getCart() {
            try {
                const savedCart = JSON.parse(localStorage.getItem("cart"));
                return Array.isArray(savedCart) ? savedCart : [];
            } catch (error) {
                return [];
            }
        }

        function saveCart(cart) {
            localStorage.setItem("cart", JSON.stringify(cart));
            displayCart();
        }

        function displayCart() {
            const cartItems = document.getElementById("cartItems");
            const grandTotal = document.getElementById("grandTotal");

            const cart = getCart();
            cartItems.innerHTML = "";

            let total = 0;

            if (cart.length === 0) {
                const row = document.createElement("tr");
                const cell = document.createElement("td");

                cell.colSpan = 3;
                cell.textContent = "Your cart is empty.";

                row.appendChild(cell);
                cartItems.appendChild(row);
            }

            cart.forEach(function (item, index) {
                const quantity = Math.max(1, Number(item.quantity) || 1);
                const price = Number(item.price) || 0;

                total += price * quantity;

                const row = document.createElement("tr");

                const nameCell = document.createElement("td");
                nameCell.textContent = item.name;

                const priceCell = document.createElement("td");
                priceCell.textContent = "$" + price.toFixed(2);

                const quantityCell = document.createElement("td");
                quantityCell.className = "quantity-cell";

                const controls = document.createElement("div");
                controls.className = "quantity-controls";

                const minus = document.createElement("button");
                minus.type = "button";
                minus.className = "quantity-btn";
                minus.textContent = "−";
                minus.setAttribute("aria-label", "Decrease " + item.name + " quantity");

                minus.addEventListener("click", function () {
                    changeQuantity(index, -1);
                });

                const quantityText = document.createElement("span");
                quantityText.className = "quantity";
                quantityText.textContent = quantity;

                const plus = document.createElement("button");
                plus.type = "button";
                plus.className = "quantity-btn";
                plus.textContent = "+";
                plus.setAttribute("aria-label", "Increase " + item.name + " quantity");

                plus.addEventListener("click", function () {
                    changeQuantity(index, 1);
                });

                controls.append(minus, quantityText, plus);
                quantityCell.appendChild(controls);

                row.append(nameCell, priceCell, quantityCell);
                cartItems.appendChild(row);
            });

            grandTotal.textContent = "$" + total.toFixed(2);
        }

        function changeQuantity(index, amount) {
            const cart = getCart();

            if (!cart[index]) {
                return;
            }

            cart[index].quantity = (Number(cart[index].quantity) || 1) + amount;

            if (cart[index].quantity <= 0) {
                cart.splice(index, 1);
            }

            saveCart(cart);
        }

        function clearCart() {
            saveCart([]);
        }

        window.addEventListener("storage", function (event) {
            if (event.key === "cart") {
                displayCart();
            }
        });

        displayCart();
    </script>

</body>

</html>
